#### crowsnest.conf
#### This is the default config after installation.
#### It is also used as the default config in MainsailOS.
#### For details on how to configure this to your needs, see:
#### https://github.com/mainsail-crew/crowsnest/blob/master/README.md


#####################################################################
####                                                            #####
####      Information about ports and according URL's           #####
####                                                            #####
#####################################################################
####                                                            #####
####    Port 8080 equals /webcam/?action=[stream/snapshot]      #####
####    Port 8081 equals /webcam2/?action=[stream/snapshot]     #####
####    Port 8082 equals /webcam3/?action=[stream/snapshot]     #####
####    Port 8083 equals /webcam4/?action=[stream/snapshot]     #####
####                                                            #####
####    Note: These ports are default for most Mainsail         #####
####    installations. Using any other port would involve       #####
####    changing the proxy configuration or using URLs          #####
####    with the specific port like                             #####
####    http://<ip>:<port>/?action=[stream/snapshot]            #####
####                                                            #####
#####################################################################
####    RTSP Stream URL: ( if enabled and supported )           #####
####    rtsp://<ip>:<rtsp_port>/stream.h264                     #####
#####################################################################


[crowsnest]
log_path: /home/orlandi/printer_data/logs/crowsnest.log
log_level: verbose                      # Valid Options are quiet/verbose/debug
delete_log: false                       # Deletes log on every restart, if set to true
no_proxy: false                         # If set to true, no reverse proxy is required. Only change this, if you know what you are doing.

#[cam 1]
#mode: camera-streamer                  # ustreamer - Provides MJPG and snapshots. (All devices)
                                        # camera-streamer - Provides WebRTC, MJPG and snapshots. (only RPiOS + RPi 0/1/2/3/4)
#port: 8080                             # HTTP/MJPG stream/snapshot port
#device: /dev/video0                    # See log for available devices
#resolution: 640x480                    # <width>x<height> format
#max_fps: 15                            # If hardware supports it, it will be forced, otherwise ignored/coerced.
#custom_flags:                          # You can run the stream services with custom flags.
#v4l2ctl:                               # Add v4l2-ctl parameters to setup your camera, see log for your camera capabilities.

[cam 1]
mode: camera-streamer                   # mjpg costuma ser mais leve que rtsp para o Pi - camera-streamer
port: 8080                              # HTTP/MJPG stream/snapshot port
device: /dev/video0                     # See log for available devices
resolution:848x480                      # Tente esta primeiro 848x480
v4l2ctl: focus_automatic_continuous=0,focus_absolute=58,auto_exposure=1,exposure_time_absolute=80,gain=10,brightness=120,contrast=100,sharpness=10
#v4l2ctl: focus_automatic_continuous=0,focus_absolute=50,auto_exposure=1,exposure_time_absolute=80,gain=10,brightness=120,contrast=75,sharpness=5
#v4l2ctl: focus_automatic_continuous=0,focus_absolute=60,auto_exposure=1,exposure_time_absolute=80,gain=10,brightness=120,contrast=75,sharpness=5
#v4l2ctl: focus_automatic_continuous=0,focus_absolute=145,auto_exposure=1,exposure_time_absolute=75,gain=10,brightness=120,contrast=75,sharpness=5
#v4l2ctl: focus_automatic_continuous=0,focus_absolute=120,auto_exposure=1,exposure_time_absolute=45,gain=5,brightness=120,contrast=70
#v4l2ctl: focus_automatic_continuous=0,focus_absolute=125,auto_exposure=1,exposure_time_absolute=80,gain=10,brightness=128,contrast=60
#v4l2ctl: focus_auto=0,focus_absolute=135,brightness=15,contrast=100,gain=1,sharpness=4
#v4l2ctl: focus_auto=0,focus_absolute=135,brightness=40,contrast=90,gain=10,sharpness=3
#v4l2ctl: focus_auto=0,focus_absolute=135,exposure_auto=1,exposure_absolute=80,gain=30
#v4l2ctl: focus_auto=0,focus_absolute=135,exposure_auto=3,exposure_absolute=150,gain=40
#v4l2ctl: focus_auto=0,exposure_auto=-3,focus_absolute=135   # Desativa foco automático (ajuda na CPU)
max_fps: 15                             # 15 FPS é o ideal para evitar lentidão

