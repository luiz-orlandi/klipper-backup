# Define o microcontrolador do próprio sensor ADXL (comum em sensores USB)
[mcu adxl]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6633C380F619635-if00

[adxl345]
cs_pin: adxl:gpio9
spi_software_sclk_pin: adxl:gpio10
spi_software_mosi_pin: adxl:gpio11
spi_software_miso_pin: adxl:gpio12

[resonance_tester]
accel_chip: adxl345
probe_points:
    127, 100, 20  # Centro da mesa da Flying Bear Ghost 5