[pause_resume]
;[display_status]

;[display]
;lcd_type: st7920
;cs_pin: PB7
;sclk_pin: PB6
;sid_pin: PA10

;[output_pin LCD_LED]
;pin: PC6
;value: 1

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor Placa_MCU]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 4000
max_z_velocity: 10
max_z_accel: 100


[bed_screws]
screw1: 30, 30
screw1_name: frente esquerda
screw2: 200, 30
screw2_name: frente direita
screw3: 200, 180
screw3_name: tras direita
screw4: 30, 180
screw4_name: tras esquerda

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4 # Se der erro aqui, use !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: !PA15
position_endstop: 0
position_max: 255
homing_speed: 50

[stepper_y]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: !PA12
position_endstop: 0
position_max: 210
homing_speed: 50

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
endstop_pin: !PA11
position_endstop: 0.5
position_max: 200

#[tmc2209 stepper_x]
#uart_pin: PA10  # Pinagem comum para a Reborn V2.0 no eixo X
#run_current: 0.800
#stealthchop_threshold: 0

#[tmc2209 stepper_y]
#uart_pin: PA9   # Pinagem comum para a Reborn V2.0 no eixo Y
#run_current: 0.800
#stealthchop_threshold: 0

[extruder]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
# Calculado dos seus 408.71 steps/mm
rotation_distance: 7.219
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.22
heater_pin: PC3
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC1
#control: pid
# Seus valores do M503:
#pid_Kp: 12.02
#pid_Ki: 0.90
#pid_Kd: 40.18
max_extrude_only_distance: 101.0
min_temp: 0
max_temp: 260

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
#control: pid
# Seus valores do M503:
#pid_Kp: 198.99
#pid_Ki: 36.88
#pid_Kd: 268.42
min_temp: 0
max_temp: 110

[fan]
pin: PB1

[heater_fan hotend_fan]
pin: PB0
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

#[input_shaper]
#shaper_freq_x: 75.1
#shaper_type_x: mzv
#shaper_freq_y: 75.1  # Use o mesmo se a outra face estiver igual
#shaper_type_y: mzv

[input_shaper]
shaper_freq_x: 48.0
shaper_type_x: mzv
shaper_freq_y: 48.0
shaper_type_y: mzv

[virtual_sdcard]
path: ~/printer_data/gcodes


[gcode_macro PAUSE]
description: Pausa a impressão atual
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE
    _TOOLHEAD_PARK_PAUSE_CANCEL

[gcode_macro RESUME]
description: Resume a impressão atual
rename_existing: RESUME_BASE
gcode:
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
description: Cancela a impressão atual
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    G91
    G1 Z10 F600
    G90
    G1 X5 Y210 F6000
    M84

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper para mover o bico para longe da peça ao pausar/cancelar
gcode:
    G91
    G1 Z5 F600
    G90
    G1 X5 Y210 F6000


[output_pin BEEPER_pin]
pin: PC5
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001

[gcode_macro MESA_COOL_DOWN]
gcode:
    # 1. Armazena a posição atual do Z e calcula o espaço restante
    {% set pos_z = printer.toolhead.position.z|float %}
    {% set limite_z = 195.0 %}
    
    # Se a posição atual + 30mm for menor que o limite, desce 30mm. 
    # Senão, desce apenas o que sobra até o limite absoluto.
    {% if (pos_z + 30.0) < limite_z %}
        {% set mover_z = 30.0 %}
    {% else %}
        {% set mover_z = limite_z - pos_z %}
    {% endif %}

    # 2. Garante coordenadas absolutas para X e Y
    G90 
    
    # 3. Move o bico para o centro da mesa
    G1 X115 Y115 F6000               

    # 4. Desce a mesa de forma segura usando o valor calculado
    {% if mover_z > 0 %}
        G91                          ; Modo relativo temporário
        G1 Z{mover_z} F1500          ; Desce apenas o espaço seguro calculado
        G90                          ; Volta para o modo absoluto
    {% endif %}

    # 5. Liga as ventoinhas da peça no máximo
    M106 S255                        

    # 6. Desliga o aquecimento do bico e da mesa
    TURN_OFF_HEATERS

    # 7. Aguarda a mesa esfriar até os ~38°C
    M117 Esfriando a mesa...
    TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM=38 

    # 8. Desliga o cooler e avisa que terminou
    M107                             
    M117 Pronto para retirar!
    M300 S1500 P250                  ; Usa a sua macro de som!

[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0
    
[exclude_object]

[gcode_macro CARGA]
description: Aquece o bico e carrega o filamento automaticamente
gcode:
    {% set TEMP = params.TEMP|default(230)|int %}
    M117 Aquecendo para carregar...
    M104 S{TEMP}                ; Começa a aquecer
    M109 S{TEMP}                ; Espera chegar na temperatura
    M300 S1000 P100             ; Bip de aviso
    M117 Carregando...
    G91                         ; Coordenadas relativas
    G1 E50 F300                 ; Extrui 50mm de filamento
    G1 E20 F150                 ; Extrui mais 20mm devagar para limpar o bico
    G90                         ; Volta para absolutas
    M400                        ; Espera os movimentos acabarem
    M300 S2000 P300             ; Bip de finalização
    M117 Carregado!

[gcode_macro DESCARGA]
description: Aquece o bico e retrai o filamento para troca
gcode:
    {% set TEMP = params.TEMP|default(230)|int %}
    M117 Aquecendo para descarregar...
    M104 S{TEMP}                ; Começa a aquecer
    M109 S{TEMP}                ; Espera chegar na temperatura
    M300 S1000 P100             ; Bip de aviso
    M117 Descarregando...
    G91                         ; Coordenadas relativas
    G1 E5 F300                  ; Extrui um pouco para evitar ponta grossa
    G1 E-80 F1000               ; Retração rápida de 80mm
    G90                         ; Volta para absolutas
    M400
    M300 S500 P500              ; Bip de aviso
    M117 Remova o filamento!

[gcode_macro SAI_DAI]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28 ; Faz o homing se já não tiver feito
    {% endif %}
    G90 ; Modo absoluto
    # Move para o canto esquerdo traseiro e levanta um pouco o Z
    G1 X5 Y210 Z30 F6000 
    M117 Cabeça estacionada.

[gcode_shell_command backup_cfg]
command: bash /home/orlandi/klipper-backup/script.sh
timeout: 30.
verbose: True

[gcode_macro BACKUP_CFG]
gcode:
    RUN_SHELL_COMMAND CMD=backup_cfg

[force_move]
enable_force_move: True

