[stepper_x]
step_pin: PE0      # O motor físico Y (frente/trás) vai para o stepper lógico X
dir_pin: PB9       # Sem inversão
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: !PA15 # Endstop físico do X original (carro)
position_endstop: 0
position_max: 255
homing_speed: 50

[stepper_y]
step_pin: PE3      # O motor físico X (direita/esquerda) vai para o stepper lógico Y
dir_pin: !PE2      # COM inversão
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: !PA12 # Endstop físico do Y original (mesa)
position_endstop: 0
position_max: 210
homing_speed: 50

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
endstop_pin: !PA11
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
# Calculado dos seus 408.71 steps/mm
rotation_distance: 7.219
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.22
heater_pin: PC3
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC1
#control: pid
# Seus valores do M503:
#pid_Kp: 12.02
#pid_Ki: 0.90
#pid_Kd: 40.18
max_extrude_only_distance: 101.0
min_temp: 0
max_temp: 260

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
#control: pid
# Seus valores do M503:
#pid_Kp: 198.99
#pid_Ki: 36.88
#pid_Kd: 268.42
min_temp: 0
max_temp: 110

[fan]
pin: PB1

[heater_fan hotend_fan]
pin: PB0
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[input_shaper]
shaper_freq_x: 75.1
shaper_type_x: mzv
shaper_freq_y: 75.1  # Use o mesmo se a outra face estiver igual
shaper_type_y: mzv

[virtual_sdcard]
path: ~/printer_data/gcodes


[gcode_macro PAUSE]
description: Pausa a impressão atual
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE
    _TOOLHEAD_PARK_PAUSE_CANCEL

[gcode_macro RESUME]
description: Resume a impressão atual
rename_existing: RESUME_BASE
gcode:
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
description: Cancela a impressão atual
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    G91
    G1 Z10 F600
    G90
    G1 X5 Y210 F6000
    M84

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper para mover o bico para longe da peça ao pausar/cancelar
gcode:
    G91
    G1 Z5 F600
    G90
    G1 X5 Y210 F6000


[output_pin BEEPER_pin]
pin: PC5
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001

[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0

[exclude_object]

[gcode_macro CARGA]
description: Aquece o bico e carrega o filamento automaticamente
gcode:
    {% set TEMP = params.TEMP|default(230)|int %}
    M117 Aquecendo para carregar...
    M104 S{TEMP}                ; Começa a aquecer
    M109 S{TEMP}                ; Espera chegar na temperatura
    M300 S1000 P100             ; Bip de aviso
    M117 Carregando...
    G91                         ; Coordenadas relativas
    G1 E50 F300                 ; Extrui 50mm de filamento
    G1 E20 F150                 ; Extrui mais 20mm devagar para limpar o bico
    G90                         ; Volta para absolutas
    M400                        ; Espera os movimentos acabarem
    M300 S2000 P300             ; Bip de finalização
    M117 Carregado!

[gcode_macro DESCARGA]
description: Aquece o bico e retrai o filamento para troca
gcode:
    {% set TEMP = params.TEMP|default(230)|int %}
    M117 Aquecendo para descarregar...
    M104 S{TEMP}                ; Começa a aquecer
    M109 S{TEMP}                ; Espera chegar na temperatura
    M300 S1000 P100             ; Bip de aviso
    M117 Descarregando...
    G91                         ; Coordenadas relativas
    G1 E5 F300                  ; Extrui um pouco para evitar ponta grossa
    G1 E-80 F1000               ; Retração rápida de 80mm
    G90                         ; Volta para absolutas
    M400
    M300 S500 P500              ; Bip de aviso
    M117 Remova o filamento!

[force_move]
enable_force_move: True

